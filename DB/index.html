<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Detail Admin Panel</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --drawer-bg: #111111;
            --card-bg: #121212;
            --accent: #007bff;
            --text: #ffffff;
            --dim: #888888;
            --border: #222222;
            --danger: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Navigation */
        nav { height: 60px; background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; z-index: 100; }
        .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; margin-right: 20px; }

        /* Drawer */
        #drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 200; }
        #drawer { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: var(--drawer-bg); z-index: 201; transition: 0.3s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        #drawer.open { left: 0; }
        .drawer-header { padding: 25px; border-bottom: 1px solid var(--border); font-weight: 700; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        #user-list { flex: 1; overflow-y: auto; padding: 10px; }
        .user-item { padding: 15px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .user-item:hover { background: rgba(255,255,255,0.05); }
        .user-item.active { background: rgba(0, 168, 255, 0.1); border-color: var(--accent); }

        /* Tabs */
        .tabs { display: flex; background: #080808; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 15px; background: none; border: none; color: var(--dim); cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* Action Bar */
        .action-bar { padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: #000; }

        /* Content Scroll Area */
        .content-area { flex: 1; overflow-y: auto; padding: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        
        .badge { font-size: 0.65rem; font-weight: 800; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; cursor: default; }
        .badge-pkg { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
        
        /* Blue Badge with Click effect */
        .badge-act { 
            background: rgba(0, 168, 255, 0.15); 
            color: var(--accent); 
            cursor: pointer; 
            transition: 0.2s;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge-act:hover { background: var(--accent); color: white; }
        
        .time-txt { font-size: 0.7rem; color: var(--dim); }
        .title-txt { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .info-txt { font-size: 0.85rem; color: #ccc; line-height: 1.4; margin-bottom: 10px; }
        .del-btn { background: none; border: 1px solid #333; color: var(--danger); padding: 5px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }

        /* Modal for Full View */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 300; padding: 20px; }
        #modal-content { background: #1a1a1a; width: 100%; max-width: 500px; border-radius: 15px; border: 1px solid var(--border); animation: zoomIn 0.2s ease; }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; color: var(--accent); font-weight: 700; }
        .modal-body { padding: 20px; color: #fff; font-size: 1rem; line-height: 1.6; word-wrap: break-word; max-height: 60vh; overflow-y: auto; }
        .close-modal { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

        .empty-msg { text-align: center; margin-top: 50px; color: var(--dim); }
        .clear-btn { background: var(--danger); color: #fff; border: none; padding: 6px 12px; border-radius: 5px; font-size: 0.75rem; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Drawer Overlay -->
    <div id="drawer-overlay" onclick="toggleDrawer()"></div>

    <!-- Sidebar Drawer -->
    <div id="drawer">
        <div class="drawer-header">
            <span>DEVICE MANAGER</span>
            <button class="menu-btn" onclick="toggleDrawer()" style="margin:0;">×</button>
        </div>
        <div id="user-list"></div>
    </div>

    <!-- Modal for Full Text View -->
    <div id="modal-overlay" onclick="closeModal()">
        <div id="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span id="modal-title">Activity Detail</span>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Navbar -->
    <nav>
        <button class="menu-btn" onclick="toggleDrawer()">☰</button>
        <div id="nav-title" style="font-weight: 600;">Select Device</div>
    </nav>

    <div class="tabs">
        <button id="tab-not" class="tab-btn active" onclick="switchTab('Users')">NOTIFICATIONS</button>
        <button id="tab-act" class="tab-btn" onclick="switchTab('UserActivities')">ACTIVITIES</button>
    </div>

    <div class="action-bar" id="action-bar" style="display: none;">
        <span id="item-count" style="font-size: 0.75rem; color: var(--dim);"></span>
        <button class="clear-btn" onclick="clearAll()">Clear Tab</button>
    </div>

    <main id="content-container" class="content-area">
        <div class="empty-msg">Menu se device select karein.</div>
    </main>

    <script>
        // --- YOUR FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "https://notification-reader-acacb-default-rtdb.firebaseio.com/",
            projectId: "notification-reader-acacb",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let selectedId = null;
        let currentTab = 'Users';

        function toggleDrawer() {
            const drw = document.getElementById('drawer');
            const ovr = document.getElementById('drawer-overlay');
            drw.classList.toggle('open');
            ovr.style.display = drw.classList.contains('open') ? 'block' : 'none';
        }

        function openModal(text, title = "Full View") {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = text;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        // Fetch Devices
        db.ref('Users').on('value', snap => {
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            const data = snap.val();
            if (data) {
                Object.keys(data).forEach(id => {
                    const div = document.createElement('div');
                    div.className = `user-item ${id === selectedId ? 'active' : ''}`;
                    div.innerHTML = `<div style="font-size: 0.8rem; font-family: monospace;">${id}</div>`;
                    div.onclick = () => selectUser(id);
                    list.appendChild(div);
                });
            }
        });

        function selectUser(id) {
            selectedId = id;
            document.getElementById('nav-title').innerText = "ID: " + id;
            document.getElementById('action-bar').style.display = "flex";
            toggleDrawer();
            refreshData();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'Users') document.getElementById('tab-not').classList.add('active');
            else document.getElementById('tab-act').classList.add('active');
            if(selectedId) refreshData();
        }

        function refreshData() {
            const container = document.getElementById('content-container');
            const path = `${currentTab}/${selectedId}`;
            
            db.ref(path).off();
            db.ref(path).on('value', snap => {
                container.innerHTML = '';
                const items = snap.val();
                if(!items) {
                    container.innerHTML = `<div class="empty-msg">No entries found.</div>`;
                    return;
                }

                const keys = Object.keys(items);
                document.getElementById('item-count').innerText = keys.length + " items";

                keys.reverse().forEach(key => {
                    const val = items[key];
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    if (currentTab === 'Users') {
                        // Notifications: Badge=Package, Title=FB Title
                        const pkg = val.app || val.package || 'System';
                        card.innerHTML = `
                            <div class="card-header">
                                <span class="badge badge-pkg" onclick="openModal('${pkg}', 'Package Name')">${pkg}</span>
                                <span class="time-txt">${val.time || ''}</span>
                            </div>
                            <div class="title-txt">${val.title || 'No Title'}</div>
                            <div class="info-txt">${val.message || val.info || ''}</div>
                            <button class="del-btn" onclick="deleteSingle('${key}')">Delete</button>
                        `;
                    } else {
                        // Activities: Badge=Activity Type (Clickable)
                        const actText = val.activity || 'TYPE_WINDOW_STATE_CHANGED';
                        card.innerHTML = `
                            <div class="card-header">
                                <span class="badge badge-act" onclick="openModal('${actText}', 'Activity Detail')">${actText}</span>
                                <span class="time-txt">${val.time || ''}</span>
                            </div>
                            <div class="info-txt" style="font-weight:600; color:#fff; font-size:0.95rem;">
                                ${val.info || val.message || 'Tracked Activity'}
                            </div>
                            <button class="del-btn" onclick="deleteSingle('${key}')">Delete</button>
                        `;
                    }
                    container.appendChild(card);
                });
            });
        }

        function deleteSingle(key) {
            if(confirm("Delete karna hai?")) db.ref(`${currentTab}/${selectedId}/${key}`).remove();
        }

        function clearAll() {
            if(confirm("Saara data clear karna hai?")) db.ref(`${currentTab}/${selectedId}`).remove();
        }
    </script>
</body>
</html>
